<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
  
    <title>Free Image Resizer & Compressor | ImageFitLab</title>
  
    <meta
      name="description"
      content="Resize, compress, rotate, and convert JPG, PNG, and WebP images privately in your browser. Free, fast, and no account required."
    />
  
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />
  
    <link
      rel="canonical"
      href="https://imagefitlab.com/"
    />
  
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
  
    <!-- Social sharing -->
    <meta
      property="og:title"
      content="ImageFitLab — Free Image Resizer & Compressor"
    />
  
    <meta
      property="og:description"
      content="Resize, compress, and convert images privately in your browser."
    />
  
    <meta
      property="og:type"
      content="website"
    />
  
    <meta
      property="og:url"
      content="https://imagefitlab.com/"
    />
  
    <meta
      name="twitter:card"
      content="summary"
    />
  
    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ImageFitLab",
        "url": "https://imagefitlab.com/",
        "description": "A free browser-based image resizer, compressor, and format converter.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
